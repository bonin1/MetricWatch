<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetricWatch Dashboard</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .chart {
            width: 100%;
            height: 300px;
        }

        .event-feed {
            max-height: 400px;
            overflow-y: auto;
        }

        .event {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .event-time {
            color: #a0aec0;
            font-size: 0.8rem;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>📊 MetricWatch</h1>
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </header>

        <div class="grid">
            <div class="card">
                <h2>System Metrics</h2>
                <div id="metricsChart" class="chart"></div>
            </div>
            <div class="card">
                <h2>Sentiment Analysis</h2>
                <div id="sentimentChart" class="chart"></div>
            </div>
        </div>

        <div class="card">
            <h2>Live Events</h2>
            <div class="event-feed" id="eventFeed">
                <div class="event">Waiting for events...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        // Initialize charts
        const metricsChart = echarts.init(document.getElementById('metricsChart'));
        const sentimentChart = echarts.init(document.getElementById('sentimentChart'));

        // Metrics chart configuration
        const metricsData = {
            cpu: [],
            memory: [],
            timestamps: []
        };

        const metricsOption = {
            backgroundColor: 'transparent',
            tooltip: { trigger: 'axis' },
            legend: {
                data: ['CPU', 'Memory'],
                textStyle: { color: '#fff' }
            },
            xAxis: {
                type: 'category',
                data: [],
                axisLabel: { color: '#fff' }
            },
            yAxis: {
                type: 'value',
                max: 100,
                axisLabel: { color: '#fff', formatter: '{value}%' }
            },
            series: [
                {
                    name: 'CPU',
                    type: 'line',
                    data: [],
                    smooth: true,
                    itemStyle: { color: '#3b82f6' }
                },
                {
                    name: 'Memory',
                    type: 'line',
                    data: [],
                    smooth: true,
                    itemStyle: { color: '#10b981' }
                }
            ]
        };

        metricsChart.setOption(metricsOption);

        // Sentiment chart configuration
        const sentimentOption = {
            backgroundColor: 'transparent',
            tooltip: { trigger: 'item' },
            legend: {
                orient: 'vertical',
                left: 'left',
                textStyle: { color: '#fff' }
            },
            series: [{
                type: 'pie',
                radius: '50%',
                data: [
                    { value: 0, name: 'Positive', itemStyle: { color: '#10b981' } },
                    { value: 0, name: 'Negative', itemStyle: { color: '#ef4444' } },
                    { value: 0, name: 'Neutral', itemStyle: { color: '#f59e0b' } }
                ],
                emphasis: {
                    itemStyle: {
                        shadowBlur: 10,
                        shadowOffsetX: 0,
                        shadowColor: 'rgba(0, 0, 0, 0.5)'
                    }
                }
            }]
        };

        sentimentChart.setOption(sentimentOption);

        // WebSocket connection
        const socket = io(API_URL);

        socket.on('connect', () => {
            document.getElementById('statusText').textContent = 'Connected';
            document.getElementById('statusDot').style.background = '#4ade80';
            addEvent('✅ Connected to server');
        });

        socket.on('disconnect', () => {
            document.getElementById('statusText').textContent = 'Disconnected';
            document.getElementById('statusDot').style.background = '#ef4444';
            addEvent('❌ Disconnected from server');
        });

        socket.on('metric_update', (data) => {
            updateMetrics(data);
            addEvent(`📊 Metric: ${data.metric_type} = ${data.value.toFixed(2)}`);
        });

        socket.on('sentiment_update', (data) => {
            updateSentiment(data);
            addEvent(`💬 Sentiment: ${data.sentiment} (${(data.score * 100).toFixed(1)}%)`);
        });

        function updateMetrics(data) {
            const time = new Date(data.timestamp).toLocaleTimeString();

            if (data.metric_type === 'cpu' || data.metric_type === 'memory') {
                metricsData.timestamps.push(time);
                if (metricsData.timestamps.length > 20) {
                    metricsData.timestamps.shift();
                }

                if (data.metric_type === 'cpu') {
                    metricsData.cpu.push(data.value);
                    if (metricsData.cpu.length > 20) metricsData.cpu.shift();
                }
                if (data.metric_type === 'memory') {
                    metricsData.memory.push(data.value);
                    if (metricsData.memory.length > 20) metricsData.memory.shift();
                }

                metricsChart.setOption({
                    xAxis: { data: metricsData.timestamps },
                    series: [
                        { data: metricsData.cpu },
                        { data: metricsData.memory }
                    ]
                });
            }
        }

        let sentimentCounts = { positive: 0, negative: 0, neutral: 0 };

        function updateSentiment(data) {
            sentimentCounts[data.sentiment]++;

            sentimentChart.setOption({
                series: [{
                    data: [
                        { value: sentimentCounts.positive, name: 'Positive' },
                        { value: sentimentCounts.negative, name: 'Negative' },
                        { value: sentimentCounts.neutral, name: 'Neutral' }
                    ]
                }]
            });
        }

        function addEvent(message) {
            const feed = document.getElementById('eventFeed');
            const event = document.createElement('div');
            event.className = 'event';
            event.innerHTML = `
                <div>${message}</div>
                <div class="event-time">${new Date().toLocaleTimeString()}</div>
            `;
            feed.insertBefore(event, feed.firstChild);

            // Keep only last 50 events
            while (feed.children.length > 50) {
                feed.removeChild(feed.lastChild);
            }
        }

        // Resize charts on window resize
        window.addEventListener('resize', () => {
            metricsChart.resize();
            sentimentChart.resize();
        });
    </script>
</body>

</html>
