global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # Configure Slack or email for production:
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/XXX'
    #     channel: '#alerts'
    #     title: 'MetricWatch Alert'
    webhook_configs:
      - url: 'http://127.0.0.1:65535/'
        send_resolved: true
